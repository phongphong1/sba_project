<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>

<body style="margin:0;padding:0;background:#F8F9FB;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
    <div
        style="max-width:600px;margin:40px auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05);">
        <div style="padding:24px 32px;text-align:center;">
            <h1 style="margin:0;color:#0F172A;font-size:24px;">Reset your password</h1>
        </div>
        <div style="padding:0 32px 32px 32px;color:#334155;text-align:center;line-height:1.6;">
            <p>Hello <strong th:text="${fullname}">User</strong>,</p>
            <p>We received a request to reset your password.</p>
            <a th:href="${resetLink}"
                style="display:inline-block;margin:16px 0;padding:12px 24px;border-radius:10px;background:#0EA5E9;color:#ffffff;text-decoration:none;font-weight:600;">Reset
                password</a>
            <p>This link will expire in <span th:text="${expiryTime}">15</span> minutes.</p>
            <p style="font-size:12px;color:#94A3B8;word-break:break-all;" th:text="${resetLink}">
                https://example.com/reset-password?token=...</p>
        </div>
    </div>
</body>

</html>
