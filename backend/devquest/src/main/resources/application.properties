spring.application.name=devquest

# Database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Auth verify configuration
app.auth.verify.expiry-minutes=${VERIFY_EXPIRY_MINUTES}
app.auth.verify.base-url=${VERIFY_BASE_URL}

# Auth reset-password configuration
app.auth.reset-password.expiry-minutes=${RESET_PASSWORD_EXPIRY_MINUTES}
app.auth.reset-password.base-url=${RESET_PASSWORD_BASE_URL}

# R2 configuration
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME}
cloudflare.r2.endpoint=${R2_ENDPOINT}
